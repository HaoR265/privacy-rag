- id: DEC-004
  topic: 代理自主变更边界
  status: confirmed
  selected: autonomous_implementation_and_evidence_based_reasonable_numeric_adjustments
  clarification_requested: false
  authorization_basis: 用户授权常规实施选择及合理范围内的误差、数值范围和参数调整由AI直接实施并同步规范；具体工程取值由AI依据证据决定，不表示用户逐项指定。
  effect: 自主实现、修复、模板、实际密码参数实例、字节接口及有依据的合理数值调整；同时更新R1/R2与工件。角色、安全假设、泄漏范围、模型修订、密码方案与锁定规格、整数环和固定预算仍须保持；无法满足正确性或必须改变受保护边界时才商讨。正式测试与验收尚未制定。
