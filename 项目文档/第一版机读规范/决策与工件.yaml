  status: confirmed
  selected: QK_special_domains_in_v1-f12-coordinated-20261013
  clarification_requested: false
  effect: 当前成套配置保留逐头Q/K RMSNorm、RoPE输出、K缓存及QK乘加特殊界；参数与接口中给出完整整数界。
- id: DEC-012
  topic: SwiGLU中间域
  status: confirmed
  selected: SwiGLU_domains_in_v1-f12-coordinated-20261013
  clarification_requested: false
  effect: joint/down输入当前采用4194304；上游SiLU/up为2048，down输出为维数相关C_d。当前取值与完整条件界由DEC-013成套配置定义。
- id: DEC-013
  topic: 成套主干与归一化数值域
  status: confirmed
  selected: v1-f12-coordinated-20261013
  clarification_requested: false
  authorization_basis: 用户明确同意成套2048方案，并授权合理误差与参数调整直接修改现行规范；本条登记AI按实际权重与解析界形成的工程选择。
  adopted_scope:
    ordinary_activation_real_abs_max: 2048
    parameter_real_abs_max: 256
    joint_and_down_input_real_abs_max: 4194304
    residual_and_down_output: C_d=floor(sqrt(d*(2^42-16)-1))，f12整数界
    RMS_L2_guards: 平方前坐标检查、累加前剩余预算检查、失败整行归零并选择安全分母和k
    QK: 保留DEC-011特殊界
    weight_binding: 所有线性矩阵实际哈希与每行L1；完整累加后一次floor
    unchanged: 角色、隐私、密码方案及规格、模型修订、固定预算、f12/f20/f24和六轮NR不变
  evidence_scope: 条件范围推导不代替完整R1或R2运行记录。
- id: DEC-014
  topic: BFV多目标系数打包与分块同态合并
  status: confirmed
  selected: evidence_supported_multi_target_packing_and_block_accumulation
  clarification_requested: false
  authorization_basis: 用户明确同意在模型与修订、Token预算、BFV锁定参数、参与方和隐私边界不变的条件下调整协议布局。
  effect: 实施代理可研究并实现目标系数互不污染的多输出打包与公开输入块同态累加，直接同步机读规范。具体布局、分组、累加上限与启用范围由实际代数、噪声和隐私依据决定；未经证明或核对的路径不启用。
  evidence_scope: 授权不表示某个公式或实现已由用户逐项确认，也不表示完整R2已运行；形成工件时分别登记解析条件、有限原语运行和完整系统状态。
- id: DEC-015
  topic: BFV矩阵Beaver预处理
  status: confirmed
  selected: BFV_cross_products_for_shared_matrix_triples
  clarification_requested: false
  authorization_basis: 用户明确同意增加BFV矩阵预处理并继续实现，要求在现有篇章原文同步机读规范。
  effect: 矩阵三元组两个随机交叉项复用普通BFV受保护矩阵内核；C持钥、完整环59、参数、模型、尺度及预算不变。标量/向量三元组保留OT。具体转置与分块由实施代理证明和核对，非用户逐项指定公式。
  evidence_scope: 候选QK/PV形状已实际匹配；正式路径及完整头以当前实施工件记录为准，完整私有GPU后端和完整R2仍未完成。
