  complete_forward_contract:
    initial_hidden: X^(0) = LookupPrivateToken(token_ids,E)，输出为 [Lq,H] f12 份额
    layer_repetition: 按公开顺序执行 28 个 decoder_block；每层使用独立的该层权重和 gamma
    after_last_block: Y = RMSNorm(X^(28),gamma_final)，输出 [Lq,H] f12 份额
    embedding_exit: 对 Y 按同一秘密最后有效位置选择整行，再执行 L2，输出 1024 维 f20 份额和秘密有效位
    generation_prefill_exit: 对 Y 按秘密最后有效位置选择一行，以绑定的 Token 表执行输出头，得到 [1,151936] f24 logits
    generation_decode_exit: 当前唯一行的末尾 RMSNorm 输出进入相同输出头；真实输出资格由秘密 alive 控制
    generation_argmax: 在公开允许 Token 集合内比较 f24 logits；不执行词表 Softmax，输出保持份额
    cache_rule: 每层保存该层经过 Q/K 归一化及 RoPE 后的 K 与未旋转 V；不同层缓存不得混用
  integer_decoder_block:
    input: '[Lq,H] f12 份额 X、该层 S 私有权重、秘密 mask 和逻辑位置；Decode 另接该层历史 K/V 份额'
    ordered_steps:
    - A = RMSNorm(X,gamma_attn)，归一化沿最后 H 维
    - Q0 = Lin12(A,W_Q)，K0 = Lin12(A,W_K)，V0 = Lin12(A,W_V)
    - 公开重排 Q0 为 [16,Lq,128]，K0 和 V0 为 [8,Lq,128]；值与有效位保持秘密
    - Q1 = per_head_RMSNorm(Q0,gamma_Q)，K1 = per_head_RMSNorm(K0,gamma_K)；各自沿 128 维
    - Q = RoPE(Q1,secret_positions)，K_new = RoPE(K1,secret_positions)；V_new = V0
    - 整段执行使用本段 K_new/V_new；Decode 先将 K_new/V_new 写入公开物理槽，再读取完整公开前缀 K/V
    - 对每个 a=0..15 和每个 query/key 对，执行 numeric_pipeline.operations.QK_score；K 头取 floor(a/2)
    - P = masked_Softmax(scores,secret_validity,public_causal_order)，P 为 f24 份额
    - 对每个 Q 头计算 PV，V 头取 floor(a/2)；输出 [16,Lq,128] f12，按原 query 有效位秘密归零
    - 公开拼接 16 个头为 [Lq,2048]；O = Lin12(concat_heads(PV),W_O)
    - Y = Checked(X + O)，两条残差分支均为 f12，先满足加法的解析不回绕条件
    - T = RMSNorm(Y,gamma_ffn)
    - G = Lin12(T,W_gate)，U = Lin12(T,W_up)，均为 [Lq,F] f12
    - J = Checked(RescaleFloor(MulShared(stable_SiLU(G),U),12))，逐位置逐特征相乘
    - B = Lin12(J,W_down)，输出 [Lq,H] f12
    - X_next = Checked(Y + B)，输出作为下一层输入
    private_gamma_scope: 输入 RMS、FFN 前 RMS、每头 Q RMS、每头 K RMS 和主干末尾 RMS 分别使用自己的参数
