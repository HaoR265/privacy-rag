runtime_and_lifecycle:
  rule_ids:
  - SEC-005
  - SEC-006
  - RUN-001
  - RUN-002
  - RUN-003
  - RUN-004
  - RUN-005
  - RUN-006
  - RUN-007
  - RUN-008
  - DAT-005
  - DAT-006
  - CRY-009
  scheduler:
    global_S_concurrent_secure_sessions: 1
    other_requests: queue_or_explicit_busy
    active_compute_total_timeout_seconds: null
    total_timeout_null_meaning: 明确不设总时限；不是未填写的超时默认值
  heartbeat:
    interval_seconds: 30
    consecutive_missed_limit: 6
    inactivity_window_seconds: 180
    worker: independent_of_compute_stage_completion
    frequency_dependent_on_secret_state: forbidden
    actual_heartbeat_frame_bytes: 104
    actual_frame_schema:
      implementation_module: native/src/heartbeat.cpp
      implementation_sha256: 3e678987adcd65bb504c5b8332496ca4726857f5d6c4dcd46ee1d2458dc31cfe
      format: PRGCF001
      stage: 18498
      operation: 0
      payload: uint64 big endian monotonically increasing counter, initially 0
      payload_bytes: 8
      header_bytes: 96
      application_frame_bytes: 104
      includes_TLS_overhead: false
      lanes: C_out and S_out independent authenticated TLS connections, bound to compute peer/session/configuration
      interval_seconds: 30
      inactivity_seconds: 180
      python_helper:
        implementation_module: private_rag/heartbeat.py
        implementation_sha256: 4570f0243b447ef0c4efc53471996b24541ca29fd31455bd0dfd82a073acf304
        actual_worker_transport: false
        struct: '!4s16sQ4s'
        frame_bytes: 32
        fields:
        - ASCII PHB1
        - UUID16
        - uint64BE sequence
        - four zero bytes
      development_probe:
        result_sha256: 07c8b2578b7b6875e62c5e262a95f456402411ad69bfdd95d60904fc67fcacf3
        entry: isolated_native_heartbeat_probe
        TLS13_mTLS_connections: 3
        initial_heartbeats: received_both_directions
        disconnect_burn: matched
        reuse_after_abort: rejected
        threads_joined: true
        interval_seconds: 30
        inactivity_seconds: 180
        elapsed_inactivity_branch_run: false
        full_system: false
    validation_status: native_three_TLS_probe_recorded_no_claim_of_elapsed_180_second_inactivity_run_or_full_R2
  message_contract:
    required_public_bindings:
    - session_id
    - stage
    - operation_sequence
    - public_configuration
    shape: fixed_for_given_public_operation_and_round
    full_integer_width: required
    secret_value_compression_or_leading_zero_elision: forbidden
    public_round_shape_changes: 只允许已冻结计划中的变化，如 Decode 的 1025+t 前缀
    old_duplicate_or_out_of_order_payload: 不猜测、不错配消费，按公开错误处理
    duplicate_control_request: 状态返回或明确错误，不重新启动计算
  logical_query_states:
  - identity_verified
  - synchronizing
  - materials_ready
  - accepted_snapshot_fixed
  - fresh_material_preparation
  - private_query_embedding
  - full_scan_retrieval
  - secret_evidence_extraction
  - fixed_private_generation
  - final_release
  - completed_and_cleaned
  public_early_termination:
    causes:
    - explicit_disconnect
    - process_exit
    - corrupted_message
    - public_version_mismatch
    - public_shape_or_sequence_mismatch
    - heartbeat_inactivity
    action: terminate_cleanup_burn_uncertain_materials
    reveal_private_error_details: forbidden
  secret_failure:
    accumulated_state: f_new = f_old OR e_j
    exposed_early: false
    public_state_machine_branch_or_exception: forbidden
    schedule: continue_with_operator_specific_safe_dummy_values
    query_recipient: U
    preparation_recipient: D
    normal_answer_when_failed: forbidden
    failed_preparation_publication: forbidden
  final_release:
    S_sends_only: fixed_permitted_answer_validity_and_status_output_shares
    S_learns_answer: false
    U_local_interpretation: EOS、有效位和最终状态
    release_before_fixed_finish: forbidden
    automatic_retry: false
    partial_release_is_success: false
    fair_exchange: not_provided
  special_cases:
    public_N_zero: 显示“当前没有可用于回答的授权资料”，不启动检索与生成
    one_valid_evidence: 第二槽秘密无效，继续同形状执行
    secret_zero_query_vector: 继续固定工作量，最后仅 U 获证据不足说明
    all_secret_document_vectors_invalid: 继续固定工作量，最后仅 U 获证据不足说明
    insufficient_or_conflicting_evidence: 固定模板要求说明；实际生成效果需要评估
    overlong_or_reserved_control_input: 输入持有方本地拒绝，不静默截断
    no_EOS_at_capacity: U 显示已生成内容并标记长度上限，不延长预算
    whole_document_export_request: 无原文导出接口；生成拒绝效果不冒充密码学保证
    secret_numeric_out_of_domain: 最后仅向规定客户端释放失败说明
  retry:
    automatic_allowed: idempotent_delivery_sync_only
    automatic_query_or_answer_release: forbidden
    cryptographic_checkpoint_resume: forbidden
    fresh_query_requires:
    - new_session_id
    - current_authorization_check
    - current_material_sync
    - new_BFV_key
    - new_OT_state
    - new_one_time_materials
    persistent_valid_document_shares_reusable: true
    unknown_material_consumption: burn
    plaintext_or_external_plain_model_fallback: forbidden
  completion_cleanup:
    destroy:
    - temporary_BFV_secret_keys
    - session_randomness
    - consumed_or_uncertain_one_time_materials
    - OT_session_state
    - intermediate_shares
    - KV_cache_shares
    preserve:
    - valid_long_term_document_shares
    - identity_keys
    - HPKE_keys
    - public_version_records
    release_snapshot_references: after_completion_or_public_abort
  logs:
    allow:
    - necessary_account_reference
    - public_versions
    - session_id
    - start_time
    - end_time
    - total_communication_cost
    - allowed_public_fault
    deny:
    - question_text
    - answer_text
    - vectors
    - shares
    - secret_indices
    - candidate_keep_bits
    - retained_candidate_count
    - institution_contribution_count
    - EOS_position
    - secret_failure_location
    evaluation_telemetry: 独立受控评估入口，仅使用允许完整观察的公开或合成数据

