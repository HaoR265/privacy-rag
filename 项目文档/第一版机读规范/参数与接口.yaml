        - chunk_index
        - format_version
        - operation_sequence
        - payload_bytes
        - public_configuration
        - session_id
        - stage
        header_encoding: ASCII canonical JSON, ensure_ascii=true, sorted keys, compact separators, allow_nan=false
        padding: 未用 header/payload 字节全零；解码拒绝非规范编码、重复或未知字段以及非零填充
