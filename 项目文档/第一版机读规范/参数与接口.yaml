        physical_lane_order:
        - compute
        - C_out
        - S_out
        C_fd_order:
        - compute
        - C_out
        - S_out
        S_fd_order:
        - compute
        - S_out
        - C_out
        input:
          transport: same-party sealed Linux memfd; never management HTTP
          magic: PRAGIN01
          header_struct: <8sBB6x16s32s32sQ
          header_bytes: 104
          header_fields:
          - magic8
          - mode_u8_prepare1_query2
          - party_u8_C0_S1
          - reserved6_zero
          - session_UUID16
          - configuration_SHA256_32
          - snapshot_SHA256_32
          - record_count_u64LE
          local_slots: uint64LE tokens[count] followed by uint8 validity[count]; full fixed capacity
          C_prepare: 257 embedding slots; zero records
          C_query: 160 embedding slots then 128 body slots then all N records
          S_prepare: zero local slots and zero records
          S_query: zero local slots followed by all N own records
          bytes: 104 + C_local_slot_count*9 + N*12296
          seals:
          - F_SEAL_WRITE
          - F_SEAL_GROW
          - F_SEAL_SHRINK
          - F_SEAL_SEAL
          record: *id001
        public_snapshot_handshake: 41 bytes = snapshot SHA256[32] || N uint64LE || mode uint8, inside authenticated
          native Channel
        events:
        - value: 1
          name: AUTHENTICATED
          when: 三 lane mTLS 与公开快照匹配后、首次 OT 前
        - value: 2
          name: RELEASING
          when: 最终释放前
        event_ACK: each event one byte, same-byte ACK after own persistent callback; reject duplicates/order mismatch/EOF;
          no automatic retry
        output:
          C_query:
            bytes: 2312
            layout: 256 uint64LE token IDs || 256 uint8 validity || one uint64LE status
          S_query:
            bytes: 0
          C_prepare:
            bytes: 8201
            layout: 1024 uint64LE own z shares || one uint64LE own e share || one uint8 private client_failed
          S_prepare:
            bytes: 8200
            layout: 1024 uint64LE own z shares || one uint64LE own e share; no private failure bit
        completion: native exit0 includes final release ACK; S prepare object fsync precedes atomic preparation
          insert+completed; query completed only after worker exit0
        full_R2_executed: false
      document_vault:
        D: AES-256-GCM, fresh 96-bit nonce, header PRDV + 00 01, nonce, ciphertext+16-byte tag
        D_AAD: canonical JSON format_version/provider_id/key_id/object_id
        keys: strict recognized OS keyring backend, no plaintext file fallback
        U: long-term X25519 HPKE keys use separate OS-keyring service
        secure_erasure: Python byte copies and OS backend behavior do not establish physical memory erasure
      public_lifecycle:
        implementation: private_rag/scheduler.py, compute_process.py, application.py; CLI compute-once
        socket_lanes: three raw connected TCP lanes compute,C_out,S_out; native mutual TLS checks enrolled account
          fingerprint and accepted snapshot; no plaintext admission header
        worker_argv_count_including_program: 22
        event_fd: 'argv20: byte1 authenticated then byte2 releasing; argv21: matching ACK after persistent callback'
        completion: native exit0 includes final release ACK; S prepare object fsync precedes atomic preparation
          insert+completed; query completed only after worker exit0
        D_delivery_readiness: both private outcomes perform identical authenticated GET own public session completion
          waiting before branching on D failure bit; only after completed+release_acknowledged may D locally retain
          successful own share or return private failure
        timeout: no total computation deadline; public TCP admission timeout separate; native fixed 30/180 heartbeat
        total_bytes: null when unmeasured
        one_party: U/C local question and U shares; D/C local chunk and D shares; S only S shares and weights; no
          two-party merge in application
        cancellation:
          route: POST /v1/sessions/{session_id}/cancel; own mTLS account; no secret failure or reason field
          identity: C preselects random session UUID before acceptance; account-bound durable cancel intent can
            overtake acceptance; no automatic acceptance replay
          claim: atomic worker_owner claim/cancel/completion transactions; claimed cancellation retains global active
            slot until child and three lanes reaped
          public_only: network/process faults or explicit user cancellation; private numeric outcome never triggers
            cancel
          recovery: CLI normal SIGTERM unwinds cleanup; hard kill or database outage requires proven old-worker
            cleanup; no automatic resume
          migration: existing active rows conservatively claimed when worker_claimed first added; preserve metadata
      material_ledger:
        states:
        - reserved
        - consumed
        - burned
        reservation: durable before first use; unique session/operation/kind binding with shape and ring59
        crash: reserved entries burned only on terminal cleanup; operator recovery requires old child and all three
          lanes confirmed stopped plus exclusive compute-owner lock; no automatic replay/resume
        terminal_cleanup: release snapshot references only after completed or public abort
        implementation_module: private_rag/lifecycle.py
        implementation_sha256: 4d07ddf8e44e2bd29b88b01a565821f561097eab99621e93d2199979b7bda294
