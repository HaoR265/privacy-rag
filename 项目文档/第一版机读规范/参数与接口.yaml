retrieval_and_mechanisms:
  rule_ids: [RET-001, RET-002, RET-003, RET-004, RET-005]
  baseline:
    N: 当前用户快照内真实授权块数，公开
    vector_dimensions: 1024
    score: 'S_i = sum_{j=0..1023}(Q_j*Z_i_j)'
    score_fractional_bits: 40
    backend: shared_shared_OT_MulShared
    full_scan: true
    ordinary_vector_DB_on_random_shares: forbidden
    top_k: 2
    candidate_fields: [secret_validity, secret_score, secret_index]
    candidate_validity: 'v_i = query_embedding_valid AND document_embedding_valid_i；所有位保持秘密'
    candidate_slot_order: 当前快照内公开且一致的用户槽位序号，获胜编号仍保持秘密
    compare_a_before_b: '(v_a AND NOT(v_b)) OR ((v_a == v_b) AND ((S_a > S_b) OR ((S_a == S_b) AND (i_a < i_b))))'
    winner_field_selection: 'Select(compare_a_before_b,field_a,field_b)，分别选择分数、索引和有效位'
    both_invalid: 仍按确定比较规则给出无效候选，必须继续保留无效位，不能当作真实命中
    ordering: [valid_first, score_descending, user_slot_index_ascending]
    comparison_tree_rounds: 2
    first_round_exclusion: 'v_i_second = v_i AND NOT(b_1 AND [i == index_1])'
    invalid_score_zero_as_worst: forbidden
    move_full_document_through_each_compare_node: false
  secret_extraction:
    selection: 'e_r_i = b_r AND v_i AND [i == index_r]'
    token_output: 'T_out_r_t = sum_i(e_r_i*T_i_t)'
    validity_output: 'm_out_r_t = sum_i(e_r_i*m_i_t)'
    output_token_shape: [2, 256]
    output_validity_shape: [2, 256]
    fractional_bits: 0
    scan: all_N_records
    invalid_position: 选择已冻结的允许 dummy Token，保持秘密零有效位
    plaintext_indexed_fetch: forbidden
  I7_boundary_precision:
    scope: research_mechanism_with_full_high_precision_baseline
    source_vector_fractional_bits: 20
    drop_bits: 12
    coarse_fractional_bits: 8
    coarse_integer: 'a=floor(Q/4096), b=floor(V/4096)'
    high_scale_approximation: 'T=sum_j(a_j*b_j)*4096^2'
    conservative_error_bound: 'B=1024*(2*2^21*4095+4095^2)'
    interval: '[T-B,T+B]'
    threshold: 第二大的有效下界 tau
    discard_condition: upper_bound_strictly_less_than_tau
    equality: retain
    fewer_than_two_valid_records: 秘密保留全部有效记录
    keep_bits_visibility: secret_shared
    production_high_precision_scope: all_N_candidates
    private_compaction: not_implemented_in_baseline
    skip_high_precision_by_secret_keep: forbidden
    disclose_kept_count: forbidden
    speedup_claim: unverified_no_claim
    screening_statistics: 只在完整输入公开的独立评估中统计
  I8_institution_contribution:
    required_chain: [full_authorization_sync, all_record_scoring, secret_top2, all_record_extraction, two_fixed_evidence_slots, fixed_generation, secret_safe_logs]
    hidden_quantity: 'c_g=sum_r sum_i(e_r_i * indicator(g_i==g))'
    organization_labels_in_generation_context: not_required_and_not_added_by_this_mechanism
    observation_comparison_scope: same_user_same_snapshot_same_public_profile
    semantic_inference_from_answer_or_known_authorization: outside_protocol_hiding_guarantee

