      native_output_forwarding: 父进程不转发 native stdout/stderr；秘密数值失败走固定最终输出/仅 D 的准备失败位
    serialization_schema:
      artifact:
        artifact: 实施工件/interfaces.json
        component: interface_delivery.json
        sha256: cb4fea7fac74311e8edb89c6c1bd85b9724db8b06c4cc1ce52dbe65a3f73d83c
      canonical_public_JSON: ASCII JSON ensure_ascii=true, sort_keys=true, compact separators, no nonfinite numbers;
        duplicate/unknown/noncanonical input rejected
      delivery_binding:
        fields:
        - user_id
        - key_version
        - opaque_slot
        - document_version
        - share_generation
        - model_numeric_version
        - protocol_version
        - format_version
        uuids: canonical lowercase hyphenated UUIDs, unique per-user per-block opaque slot
        versions: positive signed-63-bit integers
        model_numeric_version: 64 lowercase hexadecimal SHA256 characters
        protocol_version: prag-v1
        format_version: 1
        encoding: ASCII JSON ensure_ascii=true, sort_keys=true, compact separators, no nonfinite numbers; duplicate/unknown/noncanonical
          input rejected
      share_record: &id001
        byte_order: little
        word: unsigned uint64 containing residue 0<=x<2^59
        fields:
        - name: t
          shape:
          - 256
          fractional_bits: 0
          offset_bytes: 0
        - name: m
          shape:
          - 256
          fractional_bits: 0
          offset_bytes: 2048
        - name: z
          shape:
          - 1024
          fractional_bits: 20
          offset_bytes: 4096
        - name: e
          shape: []
          fractional_bits: 0
          offset_bytes: 12288
        words: 1537
        bytes: 12296
        compression: none
        no_share_magnitude_model_domain_checks: true
      HPKE:
        library: cryptography==49.0.0
        mode: Base
        kem: X25519
        kdf: HKDF-SHA256
        aead: AES-128-GCM
        api: cryptography.hazmat.primitives.hpke.Suite.encrypt/decrypt
        info: ASCII private-rag/delivery/v1 + one zero byte + canonical JSON binding
        aead_aad: empty; single-shot official API binds auxiliary authenticated fields through info
        output: 32-byte enc || 12296-byte encrypted fixed payload || 16-byte authentication tag
        total_bytes: 12344
        source_authentication: provider mTLS identity and honest server enrollment, no independent HPKE sender signature
      native_channel:
        implementation_module: native/src/channel.cpp
        implementation_sha256: 61411745b9ac3506f1fb1927bb9c8efb02ccbbcb60107041fee7a1973817f3d9
        format: PRGCF001
        actual_worker_transport: true
        header_bytes: 96
        header_fields:
        - name: magic
          offset_bytes: 0
          bytes: 8
          encoding: ASCII PRGCF001
        - name: session_id
          offset_bytes: 8
          bytes: 16
          encoding: raw UUID bytes
        - name: configuration
          offset_bytes: 24
          bytes: 32
          encoding: raw SHA256 bytes
        - name: directional_sequence
          offset_bytes: 56
          bytes: 8
          encoding: uint64 big endian
        - name: payload_bytes
          offset_bytes: 64
          bytes: 8
          encoding: uint64 big endian
        - name: stage
          offset_bytes: 72
          bytes: 8
          encoding: uint64 big endian
        - name: operation
          offset_bytes: 80
          bytes: 8
          encoding: uint64 big endian
        - name: format_version
          offset_bytes: 88
          bytes: 8
          encoding: uint64 big endian, value 1
        payload: 由公开操作确定固定 n 字节；接收方先核对预期 n、session、configuration、方向序号、stage、operation、version，再读取 n 字节
        total_bytes: 96+n；不包括 TLS 记录开销
        all_operations_have_one_global_payload_size: false
        compression: none
        p256_point_bytes: 65
        supported_native_host_ABI: x86_64 little endian
        whole_model_message_plan_verified: false
      python_generic_frame:
        implementation_module: private_rag/wire.py
        implementation_sha256: a712ee08d5571cf4a45668966e19cbdd3aa8f2bef9f01a9713d4d164afd2396c
        format: PRG1
        actual_worker_transport: false
        scope: 独立 Python 通用固定帧编码器；原生 worker 使用 PRGCF001
        prefix_struct: '!4sHHQII'
        prefix_bytes: 24
        prefix_fields:
        - magic=PRG1
        - version=1
        - flags=0
        - directional_sequence
        - header_json_bytes
        - payload_bytes
        header_area_bytes: 4096
        payload_area_bytes: 65536
        frame_bytes: 69656
        header_fields:
