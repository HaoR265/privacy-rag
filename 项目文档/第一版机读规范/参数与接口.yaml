        program: prag_worker
        argc_including_program: 22
        argv:
        - index: 1
          name: party_C_or_S
        - index: 2
          name: mode_prepare_or_query
        - index: 3
          name: compute_fd
        - index: 4
          name: outbound_heartbeat_fd
        - index: 5
          name: inbound_heartbeat_fd
        - index: 6
