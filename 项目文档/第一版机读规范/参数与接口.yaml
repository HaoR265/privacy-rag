# 第一版设计的机读参数与逻辑接口；不是已经完成的实现、构建或验证结果。
# shape 中的 N、L、t、d 等是公开参数；秘密索引和有效位不能替代这些参数。
# formula 字符串是规范表达式，不得直接当作未检查的宿主语言计算执行。
schema_version: '1.1'
specification:
  title: 第一版隐私 RAG 参数与接口
  standalone_contract: true
  required_context: 本目录机读规范；不需要额外的项目讲解文档
  status: design_specification
  implementation_status: in_progress_full_R2_not_run
  validation_status: unverified
  activation_status: blocked_pending_artifacts_and_validation
  rule_ids: [MOD-011, CRY-015, SEC-007]
  rule_registry: 技术规则.yaml
  decisions_and_artifacts: 决策与工件.yaml
  interpretation:
    null_semantics: 未生成工件的 null 不能按零值、空字符串或自动默认值启用，也不表示必须由用户再次确认；明确关闭的 rope_scaling 与总时限另有说明
    implementation_detail_decision: DEC-010
    materialization_authority: 已授权实施细节由AI按固定约束自主决定、生成并记录
    activation_scope: blocked 状态限制缺少必要前提的对应路径启用，不限制生成工件、实现该模块或推进其他模块；不是全局开工门槛
    parameter_status: 已选设计参数不代表已经实现或验证
    shape_convention: 权重形状为输出维数在前、输入维数在后；运行张量默认省略 batch=1
    rule_ids_meaning: 关联本目录技术规则.yaml 中的规则；具体输入输出、公式与参数由本文件定义
    expression_evaluation: 公式须由有符号语义、尺度和防回绕前提共同解释
  implementation_normalizations:
    - id: NORM-001
      origin: implementation_normalization
      rule_ids: [CRY-008]
      selected: Beaver 的公开乘积 DeltaX*DeltaY 仅由 S 加入一次
      semantic_change: false
      reason: 公开交叉项在两份相加时仅应出现一次；统一指定 S 承担该公开加项
    - id: NORM-002
      origin: implementation_normalization
      rule_ids: [MOD-004, MOD-010, SEC-006]
      selected: Decode t=0..254 使用长度 1025+t 的公开物理前缀
      semantic_change: false
      excluded_profile: 本配置不采用每轮均计算完整 1280 槽的备选布局
      change_rule: 切换公开布局需要更新版本、执行计划、消息形状和成本核算

security_and_roles:
  rule_ids: [SEC-001, SEC-002, SEC-003, SEC-004, SEC-005]
  adversary_model: semi_honest_non_colluding
  trusted_preprocessing_dealer: false
  roles:
    D:
      name: 资料提供方
      online_during: [document_preparation, authorization_delivery, document_update, key_recovery]
      offline_during_normal_queries: true
      private_inputs: [original_document_text, document_body_tokens, document_token_validity]
      secret_shared_holdings: [document_embedding_preparation_share, embedding_validity_preparation_share]
      complete_document_embedding_available: false
    U:
      name: 提问方
      online_during: [authorization_sync, full_query_protocol, final_release]
      runs_secure_compute_client: true
      private_inputs: [question_text, question_tokens, question_validity]
      secret_shared_holdings: [per_user_document_shares, query_and_model_intermediate_shares]
      permitted_plaintext_output: final_answer_or_prescribed_status
    S:
      name: 模型、计算与数据库服务方
      private_inputs: [embedding_weights, generation_weights]
      secret_shared_holdings: [preparation_shares, per_user_document_shares, query_and_model_intermediate_shares]
      public_management_data: [organization, internal_document_id, document_count, ACL, versions]
      final_answer_plaintext_available: false
    C:
      name: 当前密码协议客户端的别名
      fourth_party: false
      document_preparation: D
      query: U
  allowed_public_observations:
    S: [organization_mapping, internal_document_ids, ACL, published_counts, public_versions]
    U: [own_opaque_slots, own_authorized_block_count, own_version_changes]
    both_online_parties: [public_tensor_shapes, public_schedule, session_id, configuration_versions, N]
  protected_objects:
    from_S: [document_plaintext, question_plaintext, complete_embeddings, complete_model_activations, answer_plaintext]
    from_C: [S_model_weights, complete_embeddings, complete_model_activations]
    from_U_and_S: [document_plaintext_during_query, scores, selected_indices, validity_bits, candidate_keep_bits, retained_candidate_count, institution_contribution_count, EOS_position]
  disclosure_scope:
    input_owner: 不把参与方本来已知的自身输入声明为对其保密；这里约束协议新增交付的信息
    intermediate_state: 有效位、EOS及答案份额在计算期间保持共享；不能据此改变公开调度
    authorized_final_output: 固定结束后仅U恢复允许答案Token、有效位和状态；这不允许向U恢复检索索引、完整向量或中间激活
  outside_guarantees: [malicious_deviation_security, collusion_security, semantic_leakage_elimination, full_hardware_side_channel_security, fair_exchange]

representation:
  rule_ids:
  - CRY-001
  - CRY-010
  - CRY-011
  - NUM-001
  - NUM-002
  arithmetic:
    ring: Z/(2^59)Z
    ring_bits: 59
    modulus_expression: 2^59
    stored_residue_interval: '[0, 2^59-1]'
    signed_interpretation: twos_complement
    signed_interval: '[-2^58, 2^58-1]'
    signed_decode: signed(X) = X if 0 <= X < 2^58 else X-2^59
    real_interpretation: x_approx = signed(X) * 2^(-f)
    raw_product_scale: f_product = f_X + f_Y
    same_scale_addition: 相加前两输入小数位相同；结果沿用该尺度
    sharing: additive_two_party
    reconstruction: (x_C + x_S) mod 2^59
    randomness_domain: full_ring_independent_uniform
    share_local_range_check_is_valid: false
    real_quantization: floor(x * 2^f)
    negative_rounding: toward_negative_infinity
  boolean:
    sharing: xor_two_party
    reconstruction: b_C XOR b_S
    conversion_preserves_complete_value: true
  exact_discrete_types:
    fractional_bits: 0
    types:
    - token_id
    - index
    - count
    - arithmetic_validity_bit
    - one_hot_bit
    real_number_quantization: forbidden
  tensor_descriptor:
    visibility: public
    required_fields:
    - session_id
    - module_id
    - operation_id
    - shape
    - representation
    - model_version
    - protocol_version
    representation_values:
    - arithmetic_share
    - boolean_share
    - gc_bitvector
    - bfv_ciphertext
    - private_weight
    - public_value
    arithmetic_required_fields:
    - ring_bits
    - signed_interpretation
    - fractional_bits
    boolean_required_fields:
    - bit_width
    - xor_sharing_semantics
    gc_required_fields:
    - bit_width
    - integer_interpretation
    - layout_version
    bfv_required_fields:
    - parms_id
    - polynomial_degree
    - coefficient_layout
    conditional_fields_origin: implementation_normalization_of_representation_type_boundaries
    contextual_bindings:
    - user_id
    - document_version
    - authorization_generation
    - share_generation
    - delivery_id
    - format_version
    contextual_binding_rule: 按张量的阶段与来源填入适用绑定；不能把不同版本或份额代次拼接
    forbidden_fields:
    - secret_actual_length
    - selected_indices
    - candidate_count
    - institution_contribution_count
    - secret_failure_location
    - EOS_position
    actual_schema:
      implementation_module: private_rag/types.py
      implementation_sha256: b9cd366b99ed7bdeb7c284460bc343b8ebf5eee88dd0cc381be01c099a895ab8
      python_class: Descriptor
      fields:
      - name: session_id
        type: str
      - name: module_id
        type: str
      - name: operation_id
        type: int
      - name: shape
        type: tuple[int, ...]
      - name: representation
        type: str
      - name: model_version
        type: str
      - name: protocol_version
        type: str
      - name: fractional_bits
        type: int | None
      - name: ring_bits
        type: int | None
      - name: signed_interpretation
        type: str | None
      - name: bit_width
        type: int | None
      implemented_representations:
      - arithmetic_share
      - boolean_share
      - private_weight
      - public_value
      not_supported_by_this_python_class:
      - gc_bitvector
      - bfv_ciphertext
      arithmetic_validation: ring_bits=59, signed_interpretation=twos_complement, integer fractional_bits in 0..58
      boolean_validation: positive integer bit_width; fractional_bits=None; BooleanShare carries XOR-share bools
      scope: 本方类型检查，不是全部原生算子统一线协议；GC/BFV 类型边界仍由对应后端及调用约定约束
    wire_encoding:
      arithmetic_residue: uint64 little endian, 0<=value<2^59
      descriptor: Python Descriptor 本身无通用二进制序列化；已实现帧、交付和本方 worker ABI 见 interfaces.common.serialization_schema
      complete_all_representation_ABI: false
    validation_status: partially_materialized_python_and_native_boundaries_not_unified_all_types
  public_constant_injection:
    normalization_id: NORM-003
    requirement: 公开加法常数在重构值中恰好出现一次
    default_party: S
    origin: implementation_normalization
    rule_ids:
    - CRY-001
    - CRY-008
    - NUM-006
    convention: 将公开常数分享为 C 侧 0、S 侧常数；其他共享运算保持原表示
    semantic_change: false
    rationale: 常数在重构值中只出现一次；统一承担方不改变重构值
  local_operations:
    allowed:
    - same_scale_add
    - same_scale_subtract
    - public_scalar_multiply
    - public_permutation
    - public_reshape
    forbidden_substitutes:
    - sharewise_floor_shift
    - sharewise_comparison
    - plaintext_secret_branch
    - secret_index_plain_array_access

models:
  rule_ids:
  - MOD-001
  - MOD-002
  - MOD-003
  - MOD-011
  architecture_family: dense_Qwen3_decoder_only
  execution_mode: inference_only
  training_or_weight_updates: false
  dropout_enabled: false
  forward_notation:
    ell: 模型块编号 0..27
    H: 当前模型 hidden_size，Embedding 为 1024，生成模型为 2048
    F: 当前模型 intermediate_size，Embedding 为 3072，生成模型为 6144
    Lq: 当前 query 物理行数，整段执行取 L，Decode 取 1
    Lk: 当前可访问 key 的公开物理前缀行数
    X: '[Lq,H] 的 f12 hidden 份额'
    W: S 私有 f12 权重；形状为 [输出维,输入维]
    Tr_s: RescaleFloor(X,s) = floor(signed(X)/2^s)；完整值须满足不回绕前提
    Lin12: Lin12(X,W) = Checked(RescaleFloor(LinearPrivateWeight(X,W),12))，用于 f12 输入和 f12 权重
    LinRaw: LinRaw(X,W) = X*transpose(W) 的未降精度份额
    Checked: 秘密检查既定运行域，超界替换安全占位并累计秘密失败位，执行路径不改变
  shared_architecture:
    layers: 28
    query_heads: 16
    key_value_heads: 8
    query_heads_per_key_value_head: 2
    head_dim: 128
    attention: causal_grouped_query_attention
    query_head_indices_inclusive:
    - 0
    - 15
    key_value_head_indices_inclusive:
    - 0
    - 7
    query_to_KV_mapping: kv_head(a) = floor(a/2)，a 为 Q 头编号
    GQA_scope: 仅复用 K/V；16 个 Q 头各自执行 QK、Softmax 和 PV
    linear_bias: false
    QK_normalization: per_head_RMSNorm_before_RoPE
    V_normalization: none
    QK_gamma_shape:
    - 128
    QK_gamma_sharing: 同一层内各头共享各自的 Q 或 K gamma；不同层独立
    activation: SiLU_gated_MLP
    MoE: false
    sliding_window: false
    rms_norm_epsilon: 1.0e-06
    rope_theta: 1000000
    rope_scaling: null
    rope_scaling_null_meaning: 固定模型配置明确关闭；不是待填项
    weights_confidential_owner: S
    public_checkpoint_usage: 公开开源权重用于实现与验证，不改变私有权重接口
  embedding:
    model_id: Qwen/Qwen3-Embedding-0.6B
