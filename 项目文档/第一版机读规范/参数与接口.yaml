      RoPE_public_LUT_1280x128: 每个秘密位置固定11层one-hot树；128列共享同一解码，前64列cos、后64列sin；无符号位置大于1279时输出零并置共享失败位；列数与全表扫描固定
      RoPE_arithmetic: 系数份额可复用于16个Q头和8个K头；每对坐标仍作四个共享乘法、原加减、floor20与原专用域检查
      SiLU_SwiGLU: 批量化不改变输入检查、符号选择、三张exp表、六轮倒数NR、SiLU的floor24及joint的floor12
      Shift: 91位带符号桶形移位，最多32位；等价去除原128位的重复符号线，严格abs<2^56
      RMS_guarded_sum: B<=16,d<=2048；非负平方和用平衡树，每节点先查right<=L-left再相加；任一失败整行与总和归零
      L2_guarded_sum: 原1024维坐标界与平方和界、[-12,13]指数、六NR和floor24后floor4顺序不变；整行替代与最终全局失败遮罩保持
      RMS_schedule: 原坐标检查、mean floor+16、指数[-10,8]、六NR和所有floor、gamma次序不变
      softmax: 共享有效位、固定最大值、缺失键安全dummy、三张256项表、六轮倒数NR及概率检查；保持固定公开形状
      descriptor: PRAGBAT1，64字节；magic8+7个BEu64；公开LUT额外绑定完整公开表LEu64序列的SHA256；1280x128查表使用独立操作码及固定参数
      fresh_materials: 每GC新delta/标签/输出掩码；独立IKNP仅同一会话推进；全部数量先预留，失败关闭并烧毁
      implementation_evidence: 实施工件/bfv.json；有限实际核对，不是完整模型或独立安全审计
  material_lifecycle:
    bind:
    - session_id
    - operation_id
    - shape
    - ring_bits
    one_time:
    - triples
    - OT_PRG_ranges
    - BFV_masks
